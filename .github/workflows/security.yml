name: Security

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
