name: Docker Build & Push

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild every Sunday at 03:00 UTC to pull the latest yt-dlp release
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          provenance: mode=max
          sbom: true
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Notify build webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.BUILD_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "BUILD_WEBHOOK_URL secret not configured; skipping webhook notification."
            exit 0
          fi
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg event "${{ github.event_name }}" \
            --arg status "${{ job.status }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg tags "$IMAGE_TAGS" \
            --arg digest "$IMAGE_DIGEST" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              repo: $repo,
              event: $event,
              status: $status,
              branch: $branch,
              sha: $sha,
              tags: ($tags | split("\n") | map(select(length > 0))),
              digest: $digest,
              run_url: $run_url
            }' | curl -fsS -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
