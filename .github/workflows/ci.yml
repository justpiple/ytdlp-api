name: CI & Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -shuffle=on ./...

  docker:
    name: Build, Verify & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ytdlp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container (/healthz & Swagger)
        run: |
          CID=$(docker run -d --rm -p 18080:8080 ytdlp-api:ci)
          trap 'docker stop "$CID" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:18080/healthz
          echo ""
          curl -fsS -o /dev/null -w "swagger_http_code=%{http_code}\n" http://localhost:18080/swagger/index.html
          docker exec "$CID" yt-dlp --version

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Push verified image to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Notify build webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.BUILD_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "BUILD_WEBHOOK_URL secret not configured; skipping webhook notification."
            exit 0
          fi
          YTDLP_VER=$(cat requirements.txt | tr -d '\n')
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg event "${{ github.event_name }}" \
            --arg status "${{ job.status }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg ytdlp_spec "$YTDLP_VER" \
            --arg tags "$IMAGE_TAGS" \
            --arg digest "$IMAGE_DIGEST" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              repo: $repo,
              event: $event,
              status: $status,
              branch: $branch,
              sha: $sha,
              ytdlp_spec: $ytdlp_spec,
              tags: ($tags | split("\n") | map(select(length > 0))),
              digest: $digest,
              run_url: $run_url
            }' | curl -fsS -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
