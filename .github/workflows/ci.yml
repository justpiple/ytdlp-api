name: CI & Docker

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly check to pick up the latest yt-dlp release automatically
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  test:
    name: Vet & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -race -shuffle=on ./...

  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest yt-dlp version from PyPI
        id: ytdlp
        run: |
          VER=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version // "latest"' || echo "latest")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved yt-dlp version: $VER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          build-args: |
            YTDLP_VERSION=${{ steps.ytdlp.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify build webhook
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.BUILD_WEBHOOK_URL }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          YTDLP_VERSION: ${{ steps.ytdlp.outputs.version }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "BUILD_WEBHOOK_URL secret not configured; skipping webhook notification."
            exit 0
          fi
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg event "${{ github.event_name }}" \
            --arg status "${{ job.status }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg sha "${{ github.sha }}" \
            --arg ytdlp_version "$YTDLP_VERSION" \
            --arg tags "$IMAGE_TAGS" \
            --arg digest "$IMAGE_DIGEST" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              repo: $repo,
              event: $event,
              status: $status,
              branch: $branch,
              sha: $sha,
              ytdlp_version: $ytdlp_version,
              tags: ($tags | split("\n") | map(select(length > 0))),
              digest: $digest,
              run_url: $run_url
            }' | curl -fsS -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d @-
